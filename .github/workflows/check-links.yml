name: Checagem noturna de links

on:
  schedule:
    # 06:00 UTC = 03:00 em São Paulo (UTC-3, sem horário de verão)
    - cron: '0 6 * * *'
  workflow_dispatch: # permite rodar manualmente em Actions > Run workflow

permissions:
  contents: write # necessário para o bot commitar data/link-errors.json

concurrency:
  group: link-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Testar links
        run: node scripts/check-links.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          LINK_CHECK_TOKEN: ${{ secrets.LINK_CHECK_TOKEN }}

      - name: Publicar log atualizado
        run: |
          git config user.name  "link-checker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/link-errors.json
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "chore: atualiza log de links"
            git push
          fi
